```html
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba de ubicación</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .contenedor {
            background: white;
            width: 90%;
            max-width: 450px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            text-align: center;
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            color: #555;
            line-height: 1.5;
        }

        button {
            background: #1877f2;
            color: white;
            border: none;
            padding: 14px 22px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 15px;
        }

        button:hover {
            background: #0d65d9;
        }

        #resultado {
            margin-top: 25px;
            text-align: left;
            display: none;
            background: #f5f5f5;
            padding: 15px;
            border-radius: 10px;
        }

        .dato {
            margin: 8px 0;
        }

        a {
            display: block;
            margin-top: 15px;
            color: #1877f2;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="contenedor">

    <h1>Prueba de ubicación</h1>

    <p>
        Esta página necesita tu permiso para acceder a la ubicación
        de este dispositivo.
    </p>

    <p>
        La ubicación solamente se obtiene después de que aceptes
        el permiso del navegador.
    </p>

    <button onclick="obtenerUbicacion()">
        Compartir mi ubicación
    </button>

    <div id="resultado">

        <div class="dato">
            <strong>Latitud:</strong>
            <span id="latitud"></span>
        </div>

        <div class="dato">
            <strong>Longitud:</strong>
            <span id="longitud"></span>
        </div>

        <div class="dato">
            <strong>Precisión:</strong>
            <span id="precision"></span> metros
        </div>

        <a id="maps" target="_blank">
            Ver ubicación en Google Maps
        </a>

    </div>

</div>

<script>

function obtenerUbicacion() {

    if (!navigator.geolocation) {
        alert("Este navegador no permite obtener la ubicación.");
        return;
    }

    navigator.geolocation.getCurrentPosition(

        function(posicion) {

            const lat = posicion.coords.latitude;
            const lon = posicion.coords.longitude;
            const precision = posicion.coords.accuracy;

            document.getElementById("latitud").textContent =
                lat.toFixed(8);

            document.getElementById("longitud").textContent =
                lon.toFixed(8);

            document.getElementById("precision").textContent =
                Math.round(precision);

            document.getElementById("maps").href =
                "https://www.google.com/maps?q=" + lat + "," + lon;

            document.getElementById("resultado").style.display =
                "block";
        },

        function(error) {

            if (error.code === 1) {
                alert("No se concedió permiso para acceder a la ubicación.");
            } else if (error.code === 2) {
                alert("No se pudo determinar la ubicación.");
            } else if (error.code === 3) {
                alert("La solicitud de ubicación tardó demasiado.");
            } else {
                alert("Ocurrió un error al obtener la ubicación.");
            }

        },

        {
            enableHighAccuracy: true,
            timeout: 15000,
            maximumAge: 0
        }
    );
}

</script>

</body>
</html>
